<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NOTE: Placeholder image for Interiors by Anuradha. Replace with real project photo: Bedroom with warm lighting (Residential) -->
  <rect width="800" height="600" fill="#F7F2EB"/>
  
  <rect x="40" y="40" width="720" height="520" fill="#4A294B" fill-opacity="0.04" stroke="#9D9792" stroke-width="1"/>
  
  <!-- Warm glow backdrop -->
  <rect x="180" y="160" width="440" height="300" fill="#C7A05A" fill-opacity="0.15" stroke="#C7A05A" stroke-width="1.5"/>
  
  <!-- Headboard with upholstered fluting -->
  <rect x="220" y="240" width="360" height="180" fill="#5F2147" fill-opacity="0.2" stroke="#4A294B" stroke-width="1.5"/>
  <line x1="280" y1="240" x2="280" y2="420" stroke="#C7A05A" stroke-width="1"/>
  <line x1="340" y1="240" x2="340" y2="420" stroke="#C7A05A" stroke-width="1"/>
  <line x1="400" y1="240" x2="400" y2="420" stroke="#C7A05A" stroke-width="1"/>
  <line x1="460" y1="240" x2="460" y2="420" stroke="#C7A05A" stroke-width="1"/>
  <line x1="520" y1="240" x2="520" y2="420" stroke="#C7A05A" stroke-width="1"/>

  <!-- Bed platform & linens -->
  <rect x="250" y="340" width="300" height="120" rx="4" fill="#F7F2EB" stroke="#4A294B" stroke-width="1.5"/>

  <!-- Warm bedside pendant sconces -->
  <circle cx="200" cy="220" r="14" fill="#C7A05A"/>
  <circle cx="200" cy="220" r="28" fill="#C7A05A" fill-opacity="0.2"/>
  <line x1="200" y1="80" x2="200" y2="206" stroke="#C7A05A" stroke-width="2"/>
  
  <circle cx="600" cy="220" r="14" fill="#C7A05A"/>
  <circle cx="600" cy="220" r="28" fill="#C7A05A" fill-opacity="0.2"/>
  <line x1="600" y1="80" x2="600" y2="206" stroke="#C7A05A" stroke-width="2"/>

  <text x="400" y="500" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="600" fill="#4A294B">Bedroom with Warm Layered Lighting</text>
  <text x="400" y="530" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#5F2147" letter-spacing="2">RESIDENTIAL SANCTUARY</text>
</svg>
