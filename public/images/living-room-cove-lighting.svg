<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NOTE: Placeholder image for Interiors by Anuradha. Replace with real project photo: Living room with cove LED lighting (Residential) -->
  <rect width="800" height="600" fill="#F7F2EB"/>
  
  <!-- Ceiling cove with glowing warm LED effect -->
  <rect x="60" y="50" width="680" height="150" fill="#5F2147" fill-opacity="0.08" stroke="#C7A05A" stroke-width="1.5"/>
  <rect x="100" y="80" width="600" height="90" fill="#C7A05A" fill-opacity="0.2" stroke="#C7A05A" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Back living room wall -->
  <rect x="60" y="200" width="680" height="340" fill="#4A294B" fill-opacity="0.04" stroke="#9D9792" stroke-width="1"/>
  
  <!-- Modern Sofa & Coffee Table -->
  <rect x="180" y="360" width="440" height="120" rx="6" fill="#4A294B" fill-opacity="0.12" stroke="#4A294B" stroke-width="1.5"/>
  <rect x="250" y="440" width="300" height="60" rx="3" fill="#F7F2EB" stroke="#C7A05A" stroke-width="1.5"/>
  
  <!-- Ambient glow lines -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="#C7A05A" stroke-width="3"/>

  <text x="400" y="300" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#4A294B">Living Room with Cove LED Lighting</text>
  <text x="400" y="330" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#5F2147" letter-spacing="2">RESIDENTIAL LIGHT ARCHITECTURE</text>
</svg>
